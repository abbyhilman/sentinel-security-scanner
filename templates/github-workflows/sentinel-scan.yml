name: Sentinel Security Scan

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Run isolated scanners and build sanitized report
        env:
          SENTINEL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SENTINEL_REPORT_PATH: ${{ runner.temp }}/sentinel/report.json
        run: node .github/sentinel/sentinel-runner.mjs

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-sanitized-report
          path: ${{ runner.temp }}/sentinel/report.json
          if-no-files-found: error
          retention-days: 3

  report:
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Download sanitized report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sentinel-sanitized-report
          path: ${{ runner.temp }}/sentinel-sanitized-report

      - name: Send report with GitHub Actions OIDC
        env:
          SENTINEL_SUPABASE_URL: ${{ vars.SENTINEL_SUPABASE_URL }}
          SENTINEL_PAIRING_NONCE: ${{ secrets.SENTINEL_PAIRING_NONCE }}
          SENTINEL_REPORT_PATH: ${{ runner.temp }}/sentinel-sanitized-report/report.json
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { constants as fsConstants } from 'node:fs';
          import { lstat, open, realpath } from 'node:fs/promises';
          import path from 'node:path';

          const maxBytes = 4 * 1024 * 1024;
          const endpointSetting = process.env.SENTINEL_SUPABASE_URL || '';
          const pairingNonce = process.env.SENTINEL_PAIRING_NONCE || '';

          try {
            const reportPath = process.env.SENTINEL_REPORT_PATH;
            const expectedDirectory = path.resolve(
              process.env.RUNNER_TEMP,
              'sentinel-sanitized-report',
            );
            if (path.basename(reportPath) !== 'report.json') {
              throw new Error('invalid report path');
            }
            const directoryInfo = await lstat(expectedDirectory);
            if (!directoryInfo.isDirectory()) throw new Error('invalid artifact directory');
            if ((await realpath(path.dirname(reportPath))) !== (await realpath(expectedDirectory))) {
              throw new Error('report is outside artifact directory');
            }
            const reportFile = await open(
              reportPath,
              fsConstants.O_RDONLY | fsConstants.O_NOFOLLOW | fsConstants.O_NONBLOCK,
            );
            let report;
            try {
              const details = await reportFile.stat();
              if (!details.isFile() || details.size > maxBytes) {
                throw new Error('invalid report size');
              }
              report = JSON.parse(await reportFile.readFile('utf8'));
            } finally {
              await reportFile.close();
            }
            if (
              report.schemaVersion !== 1 ||
              Object.hasOwn(report, 'pairingNonce') ||
              report.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID) ||
              report.repository?.fullName !== process.env.EXPECTED_REPOSITORY ||
              report.github?.runId !== Number(process.env.EXPECTED_RUN_ID) ||
              report.github?.runAttempt !== Number(process.env.EXPECTED_RUN_ATTEMPT) ||
              report.github?.sha !== process.env.EXPECTED_SHA ||
              report.github?.ref !== process.env.EXPECTED_REF ||
              report.github?.workflowRef !== process.env.EXPECTED_WORKFLOW_REF ||
              !['completed', 'partial', 'failed'].includes(report.summary?.status)
            ) {
              throw new Error('report identity mismatch');
            }

            if (!endpointSetting) {
              console.log('::warning::Report belum dikirim. SENTINEL_SUPABASE_URL belum dikonfigurasi.');
              if (report.summary.status !== 'completed') process.exitCode = 1;
            } else {
              const baseUrl = new URL(endpointSetting);
              if (
                baseUrl.protocol !== 'https:' ||
                !/^[a-z0-9-]+\.supabase\.co$/u.test(baseUrl.hostname) ||
                baseUrl.port ||
                baseUrl.pathname !== '/' ||
                baseUrl.username ||
                baseUrl.password ||
                baseUrl.search ||
                baseUrl.hash
              ) {
                throw new Error('invalid endpoint');
              }
              if (pairingNonce && !/^[A-Za-z0-9_-]{16,256}$/u.test(pairingNonce)) {
                throw new Error('invalid pairing');
              }

            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!requestUrl || !requestToken) throw new Error('OIDC unavailable');
            const oidcUrl = new URL(requestUrl);
            if (oidcUrl.protocol !== 'https:') throw new Error('OIDC URL is not secure');
            oidcUrl.searchParams.set(
              'audience',
              'https://' + baseUrl.host + '/functions/v1/sentinel-ingest',
            );
            const oidcResponse = await fetch(oidcUrl, {
              headers: { authorization: 'Bearer ' + requestToken },
              signal: AbortSignal.timeout(15_000),
            });
            if (!oidcResponse.ok) throw new Error('OIDC request failed');
            const oidcResult = await oidcResponse.json();
            if (typeof oidcResult.value !== 'string' || !oidcResult.value) {
              throw new Error('OIDC token missing');
            }

            const requestBody = JSON.stringify(
              pairingNonce ? { ...report, pairingNonce } : report,
            );
            if (Buffer.byteLength(requestBody, 'utf8') > maxBytes) {
              throw new Error('report exceeds limit');
            }
            const idempotencyKey = createHash('sha256')
              .update(
                `sentinel:v1:${process.env.EXPECTED_REPOSITORY_ID}:${process.env.EXPECTED_RUN_ID}:${process.env.EXPECTED_RUN_ATTEMPT}`,
              )
              .digest('hex');
            const ingestUrl = new URL('/functions/v1/sentinel-ingest', baseUrl);
            const response = await fetch(ingestUrl, {
              method: 'POST',
              headers: {
                authorization: 'Bearer ' + oidcResult.value,
                'content-type': 'application/json',
                'idempotency-key': idempotencyKey,
              },
              body: requestBody,
              signal: AbortSignal.timeout(30_000),
            });
            await response.body?.cancel();
            if (!response.ok) {
              console.error('Sentinel ingestion returned HTTP ' + response.status + '.');
              process.exitCode = 1;
            } else if (report.summary.status !== 'completed') {
              console.error(
                'Sentinel accepted a ' + report.summary.status + ' report; the scan was incomplete.',
              );
              process.exitCode = 1;
            } else {
              console.log('Sentinel accepted the sanitized report (HTTP ' + response.status + ').');
            }
            }
          } catch {
            console.error('Sentinel report delivery failed. No response body or token was logged.');
            process.exitCode = 1;
          }
          NODE
